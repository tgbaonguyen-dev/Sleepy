[package]
name = "sleepy"
version = "2.0.0"
description = "Sleepy — hẹn giờ tắt máy, ngủ, khoá màn hình cho Ubuntu"
authors = ["Nguyen Tran Gia Bao"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sleepy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

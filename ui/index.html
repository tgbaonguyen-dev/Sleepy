<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleepy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="app">
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region><span id="brand-ico"></span>Sleepy</div>
      <div class="winctl">
        <button data-win="min" title="Thu nhỏ"></button>
        <button data-win="max" title="Phóng to"></button>
        <button data-win="close" class="close" title="Đóng (ẩn xuống khay)"></button>
      </div>
    </header>
    <nav class="rail" id="rail"></nav>
    <main class="main" id="main"></main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/bridge.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/morph.js"></script>
  <script src="js/dropdown.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sky.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Nghỉ — sắp đến giờ</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    html, body { background: transparent; }
    body::before { display: none; }
    .card-w { position: absolute; inset: 10px; border-radius: 26px; overflow: hidden; display: grid; grid-template-columns: 132px 1fr; gap: 18px; padding: 20px 22px 18px 20px;
      background: radial-gradient(300px 200px at 0% 0%, var(--halo), transparent 70%), linear-gradient(160deg, var(--bg1), var(--bg0));
      border: 1px solid var(--line-2); box-shadow: 0 18px 40px -12px rgba(0,0,0,.6); -webkit-app-region: drag; animation: slide .5s var(--ease); }
    .card-w.final { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
    @keyframes slide { from { transform: translateX(60px); opacity: 0; } }
    .ring { position: relative; width: 132px; height: 132px; }
    .ring svg { width: 100%; height: 100%; overflow: visible; }
    .ring .ic { position: absolute; inset: 0; display: grid; place-items: center; color: var(--moon); }
    .ring .ic svg { width: 34px; height: 34px; }
    .card-w.hot .ring .ic { color: var(--lamp); } .card-w.final .ring .ic { color: var(--danger); animation: beat 1s infinite; }
    @keyframes beat { 50% { transform: scale(1.12); } }
    .info { display: flex; flex-direction: column; justify-content: center; }
    .title { font-size: 13px; color: var(--ink-2); font-weight: 550; }
    .clock { font-size: 58px; font-weight: 250; letter-spacing: -.045em; line-height: 1.05; transition: color .5s; }
    .card-w.hot .clock { color: var(--lamp); } .card-w.final .clock { color: var(--danger); }
    .msg { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
    .msg b { color: var(--ink-2); font-weight: 600; }
    .row2 { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; -webkit-app-region: no-drag; }
    .row2 .gap { flex: 1; }
    .row2 .btn { padding: 8px 14px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card-w" id="card" data-tauri-drag-region>
    <div class="ring"><svg viewBox="0 0 132 132" id="ring"></svg><div class="ic" id="ic"></div></div>
    <div class="info">
      <div class="title" id="title">Sắp tắt máy</div>
      <div class="clock num" id="clock">--:--</div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="row2">
      <div class="bgroup"><span>Hoãn</span><button data-post="5">5 phút</button><button data-post="15">15 phút</button></div>
      <span class="gap"></span>
      <button class="btn ghost" id="now">Làm ngay</button>
      <button class="btn primary" id="cancel">Huỷ</button>
    </div>
  </div>
  <script src="js/bridge.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/warning.js"></script>
</body>
</html>
